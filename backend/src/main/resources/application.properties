spring.application.name=princess-project

server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:princess_project}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-4o-mini

jwt.secret=${JWT_SECRET:dev-only-insecure-secret-please-override-in-production-0123456789}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.region=${AWS_REGION:auto}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

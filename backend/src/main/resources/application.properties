spring.application.name=princess-project

server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:princess_project}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

openai.api.key=${OPENAI_API_KEY:}
# Vision and feedback are billed very differently, so they get their own model setting.
# gpt-4o-mini multiplies image tokens ~33x, which made photo checks cost roughly 7x more
# than gpt-4.1-mini despite the lower per-token price. Feedback is text-only and cheap, so
# it stays on gpt-4o-mini.
openai.model.vision=${OPENAI_MODEL_VISION:gpt-4.1-mini}
openai.model.feedback=${OPENAI_MODEL_FEEDBACK:gpt-4o-mini}

jwt.secret=${JWT_SECRET:dev-only-insecure-secret-please-override-in-production-0123456789}
# 30-day challenge app - a 1-day token (the old default) expired mid-challenge and left users
# stuck looking "logged in" with every data request silently failing. 30 days so a session
# survives the whole challenge; client.ts also now force-logs-out on any 401 as a backstop.
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:43200}

storage.bucket.name=${BUCKET_NAME:}
storage.bucket.region=${BUCKET_REGION:auto}
storage.bucket.endpoint=${BUCKET_ENDPOINT:}
storage.bucket.path-style-access=${BUCKET_PATH_STYLE_ACCESS:true}
storage.bucket.access-key-id=${BUCKET_ACCESS_KEY_ID:}
storage.bucket.secret-access-key=${BUCKET_SECRET_ACCESS_KEY:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 2026-08-22: 프로덕션 배포(Vercel) 도메인이 CORS 허용 목록에 없어서 로그인이 전부
# "Access-Control-Allow-Origin" 에러로 막히던 문제 - Railway에 CORS_ALLOWED_ORIGINS 환경변수를
# 안 걸어놔도 최소한 지금 프로덕션 프론트 도메인은 기본값으로 통과하도록 추가.
# 새 커스텀 도메인이 생기면 Railway 환경변수 CORS_ALLOWED_ORIGINS에 콤마로 추가해줄 것.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://princess-project-2026.vercel.app}

# ---- mail (비밀번호 찾기 / 이메일 인증 코드 발송용) ----
# 2026-08-27: Gmail SMTP 직통에서 Resend(https://resend.com) HTTP API로 전환 - dev 환경
# (Railway)에서 smtp.gmail.com:587로 나가는 아웃바운드 연결이 계속 타임아웃나서(포트 자체가
# 막혀있는 것으로 판단) SMTP를 완전히 포기하고 일반 HTTPS 요청만 쓰는 방식으로 옮겼다.
# RESEND_API_KEY는 Resend 대시보드에서 발급. mail.from 기본값(onboarding@resend.dev)은
# Resend 쪽에서 도메인 인증 없이 바로 쓸 수 있는 발신 주소지만, 그 상태에서는 계정 소유자
# 본인 이메일로만 수신이 허용되는 샌드박스 제한이 있다 - 실제 참가자 전원에게 보내려면 Resend에서
# 도메인을 인증하고 MAIL_FROM을 그 도메인 주소로 바꿔야 한다.
resend.api-key=${RESEND_API_KEY:}
mail.from=${MAIL_FROM:onboarding@resend.dev}

# 비밀번호 재설정 메일에 넣을 링크의 기준 주소. 배포 시 실제 프론트 URL로 반드시 override할 것.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

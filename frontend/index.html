    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        window.dataLayer.push(arguments);

      window.gtag = gtag;
      gtag("js", new Date());
      // React sends page_view for the initial URL and every SPA route change.
      gtag("config", "%VITE_GA_MEASUREMENT_ID%", { send_page_view: false });
    </script>

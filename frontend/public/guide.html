<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가이드라인 | Princess Project</title>
    <style>
      :root {
        --bg: #faf7f3;
        --surface: #f3e4e4;
        --border: #a9a29a;
        --text: #1d1a17;
        --text-muted: #a9a29a;
        --accent: #d48a94;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.7;
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 20px 80px;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 8px 0 24px;
      }
      section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px 22px;
        margin-bottom: 16px;
      }
      section h2 {
        margin-top: 0;
        font-size: 16px;
      }
      p {
        color: var(--text);
      }
      .muted {
        color: var(--text-muted);
        font-size: 13.5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="eyebrow">Guideline</span>
      <h1>습관자본 · 미션 설정 가이드라인</h1>
      <p class="muted">이 페이지는 자리표시자입니다 - 아래 내용을 채워 넣어 주세요.</p>

      <section>
        <h2>1. 습관자본이란?</h2>
        <p>여기에 내용을 채워 넣어 주세요.</p>
      </section>

      <section>
        <h2>2. 미션 설정 방법</h2>
        <p>여기에 내용을 채워 넣어 주세요.</p>
      </section>

      <section>
        <h2>3. 참가비 및 환급 조건</h2>
        <p>여기에 내용을 채워 넣어 주세요.</p>
      </section>
    </div>
  </body>
</html>

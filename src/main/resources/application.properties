spring.application.name=princess-project

spring.datasource.url=jdbc:mysql://localhost:3306/princess_project
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-4o-mini

jwt.secret=${JWT_SECRET:dev-only-insecure-secret-please-override-in-production-0123456789}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.region=${AWS_REGION:ap-northeast-2}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


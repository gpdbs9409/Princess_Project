<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오늘의 미션 - Princess Project</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
    <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <h1>오늘의 미션</h1>
        <a href="#" class="link" id="reset-link">다른 사용자로 시작</a>
    </div>

    <section class="card">
        <h2>오늘의 성장</h2>
        <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
        <div id="total-score" style="margin-bottom: 10px; font-size: 14px; color: var(--muted);"></div>
        <div class="stat-chip-row" id="stat-chips"></div>
    </section>

    <section class="card">
        <h2>미션</h2>
        <div class="mission-list" id="mission-list"></div>
    </section>

    <section class="card">
        <h2>AI 트레이너</h2>
        <button id="complete-btn">오늘 완료</button>
        <div id="ai-feedback" style="margin-top: 16px;"></div>
    </section>
</main>

<script src="app.js"></script>
<script>
    const params = new URLSearchParams(location.search);
    const userId = params.get("userId");
    if (!userId) {
        location.href = "index.html";
    }

    document.getElementById("reset-link").addEventListener("click", (e) => {
        e.preventDefault();
        localStorage.removeItem("princess_user_id");
        localStorage.removeItem("princess_token");
        location.href = "index.html";
    });

    const date = todayIso();
    let missions = [];

    async function loadMissions() {
        missions = await api("/api/missions");
    }

    function renderMissionList(summary) {
        const list = document.getElementById("mission-list");
        list.innerHTML = "";
        missions.forEach((mission) => {
            const isComplete = summary.completedMissions.includes(mission.name);
            const wrapper = document.createElement("div");
            wrapper.className = "mission" + (isComplete ? " complete" : "");
            wrapper.innerHTML = `
                <div class="mission-header">
                    <span class="name">${mission.name}</span>
                    <span class="points">${mission.assignedPoints}점 · 목표 ${mission.targetValue}${mission.unit}</span>
                </div>
                <label>수행량 (${mission.unit})</label>
                <input type="number" step="0.1" min="0" class="input-value" placeholder="예: 1" />
                <label>메모 (선택)</label>
                <input type="text" class="input-memo" placeholder="오늘 어땠나요?" />
                <label>사진 (선택)</label>
                <input type="file" accept="image/*" class="input-photo" />
                <button class="save-btn">저장</button>
            `;
            wrapper.querySelector(".save-btn").addEventListener("click", async (event) => {
                const button = event.currentTarget;
                const inputValue = Number(wrapper.querySelector(".input-value").value || 0);
                const memo = wrapper.querySelector(".input-memo").value;
                const photoFile = wrapper.querySelector(".input-photo").files[0];

                button.disabled = true;
                try {
                    let photoUrl = null;
                    if (photoFile) {
                        const uploaded = await uploadFile(photoFile);
                        photoUrl = uploaded.url;
                    }

                    const updatedSummary = await api("/api/records", "POST", {
                        userId: Number(userId),
                        missionId: mission.id,
                        date,
                        inputValue,
                        photoUrl,
                        memo: memo || null,
                    });
                    renderSummary(updatedSummary);
                    renderMissionList(updatedSummary);
                } finally {
                    button.disabled = false;
                }
            });
            list.appendChild(wrapper);
        });
    }

    const STAT_LABELS = {
        physical: "신체", economy: "경제", culture: "문화", knowledge: "지식",
        language: "언어", psychology: "심리", symbol: "상징"
    };

    function renderSummary(summary) {
        const percent = Math.round(summary.progress * 100);
        document.getElementById("progress-fill").style.width = percent + "%";
        document.getElementById("total-score").textContent =
            `총점 ${Math.round(summary.totalScore)}점 · 달성률 ${percent}%`;

        const chips = document.getElementById("stat-chips");
        chips.innerHTML = "";
        Object.entries(summary.statScores).forEach(([stat, score]) => {
            const chip = document.createElement("span");
            chip.className = "stat-chip";
            chip.textContent = `${STAT_LABELS[stat] || stat} ${Math.round(score)}`;
            chips.appendChild(chip);
        });

        if (summary.aiFeedback) {
            renderFeedback(summary.aiFeedback);
        }
    }

    function renderFeedback(feedback) {
        const container = document.getElementById("ai-feedback");
        container.innerHTML = `
            <div class="feedback-item"><div class="label">요약</div><div>${feedback.summary}</div></div>
            <div class="feedback-item"><div class="label">칭찬</div><div>${feedback.praise}</div></div>
            <div class="feedback-item"><div class="label">보완할 점</div><div>${feedback.improvement}</div></div>
            <div class="feedback-item"><div class="label">내일은</div><div>${feedback.tomorrow}</div></div>
            <div class="feedback-item"><div class="label">응원</div><div>${feedback.cheer}</div></div>
        `;
    }

    document.getElementById("complete-btn").addEventListener("click", async () => {
        const btn = document.getElementById("complete-btn");
        btn.disabled = true;
        btn.textContent = "생성 중...";
        try {
            const feedback = await api(`/api/users/${userId}/ai-feedback?date=${date}`, "POST");
            renderFeedback(feedback);
        } finally {
            btn.disabled = false;
            btn.textContent = "오늘 완료";
        }
    });

    (async function init() {
        localStorage.setItem("princess_user_id", userId);
        await loadMissions();
        const summary = await api(`/api/users/${userId}/daily?date=${date}`);
        renderSummary(summary);
        renderMissionList(summary);
    })();
</script>
</body>
</html>
